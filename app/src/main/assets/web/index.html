/** [x seconds, ...series in display units] for the selected ride, or for the live buffer. Gaps are null. */
function chartData(keys) {
  if (liveMode) {
    return [LIVE.t.map((t) => t / 1000)].concat(keys.map((k) => (LIVE.cols[k] || LIVE.t.map(() => null)).map((v) => (v == null ? null : disp(k, v)))));
  }
  const [a, b] = RANGE;
  const xs = Array.from(DATA.t.subarray(a, b + 1), (v) => v / 1000);
  return [xs].concat(keys.map((k) => {
    const col = DATA.cols[k];
    if (!col) return xs.map(() => null);
    // A null where a new ride starts keeps "Whole day" from joining two rides with a straight line.
    return Array.from(col.subarray(a, b + 1), (v, j) => (isNaN(v) || (j > 0 && DATA.t[a + j] - DATA.t[a + j - 1] > 180000) ? null : disp(k, v)));
  }));
}

// Axis label helpers: y labels sized to fit (no clipped "2,000"), compact thousands, clock times on x.
function axisSize(u, values, axisIdx, cycle) {
  const axis = u.axes[axisIdx];
  if (cycle > 1) return axis._size;
  let size = axis.ticks.size + axis.gap;
  const longest = (values || []).reduce((acc, v) => (String(v).length > acc.length ? String(v) : acc), "");
  if (longest) { u.ctx.font = axis.font[0]; size += u.ctx.measureText(longest).width / (devicePixelRatio || 1); }
  return Math.ceil(size) + 2;
}
const yVals = (u, vals) => vals.map((v) => (v == null ? "" : Math.abs(v) >= 1000 ? +(v / 1000).toFixed(1) + "k" : String(+v.toFixed(2))));
function xVals(u, vals) {
  const secs = CHART_WIN !== "all" && +CHART_WIN <= 300;
  return vals.map((v) => new Date(v * 1000).toLocaleTimeString("en-GB", secs ? { hour: "2-digit", minute: "2-digit", second: "2-digit" } : { hour: "2-digit", minute: "2-digit" }));
}
/** Index of the last sample at or before t (seconds), or -1. */
function idxAt(xs, t) {
  let lo = 0, hi = xs.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (xs[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}
const nowT = () => (liveMode ? (LIVE.t[LIVE.t.length - 1] || Date.now()) : DATA ? DATA.t[POS] : 0);

function drawCharts() {
  charts.forEach((c) => c.destroy());
  charts.length = 0;
  const host = $("charts");
  host.innerHTML = "";
  if (liveMode ? LIVE.t.length < 2 : !DATA) {
    if (liveMode) host.innerHTML = '<div class="empty">Waiting for live data…</div>';
    return;
  }
  const width = Math.max(240, host.clientWidth);
  const narrow = innerWidth < 560;
  const colors = [css("--s1"), css("--s2"), css("--s3")];
  const surface = css("--surface"), bandFill = css("--band");
  CHART_DEFS.filter((d) => d.on && d.keys.length).forEach((d) => {
    const data = chartData(d.keys);
    if (!liveMode && data.slice(1).every((y) => y.every((v) => v == null))) return;
    const single = d.keys.length === 1, k0 = d.keys[0];
    const wrap = document.createElement("div");
    wrap.className = "chart";
    wrap.innerHTML = `<div class="ttl"><b>${d.title}</b><span class="stats"></span><span class="read"></span></div>`;
    host.appendChild(wrap);
    const band = d.band || (single && PID[k0].low != null ? [disp(k0, PID[k0].low), disp(k0, PID[k0].high)] : null);
    const m = { keys: d.keys, single, k0, colors, surface, read: wrap.querySelector(".read"), stats: wrap.querySelector(".stats"), yr: [0, 1], tNow: null, hover: false };
    // The y range covers the whole ride (or everything live so far), so the axis stays still while the window scrolls.
    m.refresh = (ys) => {
      let lo = Infinity, hi = -Infinity;
      ys.forEach((y) => y.forEach((v) => { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } }));
      const stats = d.keys.map((k, i) => {
        if (!isFinite(lo)) return "";
        let a = Infinity, b = -Infinity;
        ys[i].forEach((v) => { if (v != null) { if (v < a) a = v; if (v > b) b = v; } });
        if (!isFinite(a)) return "";
        return (single ? "" : PID[k].label + ": ") + "min " + fmtNum(a) + " · max " + fmtNum(b) + (rangeTxt(k) ? " · normal " + rangeTxt(k) : "");
      }).filter(Boolean).join("   ");
      if (d.band) { lo = Math.min(lo, d.band[0]); hi = Math.max(hi, d.band[1]); }
      if (!isFinite(lo)) { lo = 0; hi = 1; }
      m.yr = uPlot.rangeNum(lo, hi, 0.1, true);
      m.stats.textContent = unit(k0) + (stats ? " · " + stats : "");
    };
    m.refresh(data.slice(1));
    const axis = { stroke: css("--muted"), grid: { stroke: css("--line"), width: 1 }, ticks: { stroke: css("--line"), width: 1 }, font: "11px Inter, system-ui, sans-serif" };
    const u = new uPlot({
      width, height: narrow ? 150 : 170,
      cursor: { sync: { key: "ride" }, drag: { x: false, y: false }, points: { size: 7 } },
      legend: { show: !single, live: true },
      scales: { x: { time: true }, y: { range: () => m.yr } },
      axes: [Object.assign({}, axis, { values: xVals }), Object.assign({}, axis, { values: yVals, size: axisSize })],
      series: [{ value: (uu, v) => (v == null ? "--" : fmtClock(v * 1000)) }].concat(d.keys.map((k, i) => ({
        label: PID[k].label, stroke: colors[i % colors.length], width: 2, spanGaps: false, points: { show: false },
        value: (uu, v) => (v == null ? "--" : fmtNum(v) + " " + unit(k)),
      }))),
      hooks: {
        drawClear: [(uu) => {
          if (!band) return;
          const y0 = uu.valToPos(band[1], "y", true), y1 = uu.valToPos(band[0], "y", true);
          const ctx = uu.ctx;
          ctx.save();
          ctx.fillStyle = bandFill;
          ctx.fillRect(uu.bbox.left, Math.min(y0, y1), uu.bbox.width, Math.abs(y1 - y0));
          ctx.restore();
        }],
        draw: [(uu) => drawNow(uu)],
        setCursor: [(uu) => {
          if (!single) return;
          const i = uu.cursor.idx;
          if (i == null) { showAt(uu); return; }
          const v = uu.data[1][i];
          m.read.textContent = v == null ? "" : fmtClock(uu.data[0][i] * 1000) + "  " + fmtNum(v) + " " + unit(k0);
        }],
      },
    }, data, wrap);
    u._m = m;
    u.over.addEventListener("mouseenter", () => (m.hover = true));
    u.over.addEventListener("mouseleave", () => { m.hover = false; showAt(u); });
    // Tap or click a chart to jump there (recorded rides only).
    u.over.addEventListener("click", (e) => {
      if (liveMode) return;
      const i = u.posToIdx(e.offsetX);
      if (i != null && i >= 0) seek(RANGE[0] + i, true);
    });
    charts.push(u);
  });
  if (!charts.length) host.innerHTML = '<div class="empty">Pick a chart above to see it for this ride.</div>';
  updateChartWindow(nowT(), true);
}

/** The "now" marks: a dot at the current value of each line; in Whole ride, also a playback line. */
function drawNow(u) {
  const m = u._m;
  if (!m || m.tNow == null) return;
  const ctx = u.ctx, dpr = devicePixelRatio || 1, xs = u.data[0];
  if (CHART_WIN === "all") {
    const x = u.valToPos(m.tNow, "x", true);
    if (x >= u.bbox.left && x <= u.bbox.left + u.bbox.width) {
      ctx.save();
      ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.moveTo(x, u.bbox.top); ctx.lineTo(x, u.bbox.top + u.bbox.height); ctx.stroke();
      ctx.restore();
    }
  }
  const i = idxAt(xs, m.tNow);
  if (i < 0) return;
  for (let s = 1; s < u.series.length; s++) {
    const v = u.data[s][i];
    if (v == null) continue;
    const cx = u.valToPos(xs[i], "x", true), cy = u.valToPos(v, "y", true);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, 4.5 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = m.colors[(s - 1) % m.colors.length]; ctx.fill();
    ctx.lineWidth = 2 * dpr; ctx.strokeStyle = m.surface; ctx.stroke();
    ctx.restore();
  }
}

/** When nobody is hovering a chart, its readout shows the values at the playback moment. */
function showAt(u) {
  const m = u._m;
  if (!m || m.hover || m.tNow == null) return;
  const i = idxAt(u.data[0], m.tNow);
  if (i < 0) return;
  if (m.single) {
    const v = u.data[1][i];
    m.read.textContent = v == null ? "" : fmtNum(v) + " " + unit(m.k0);
  } else if (u.setLegend) {
    u.setLegend({ idx: i });
  }
}

let lastChartDraw = 0;
/** Scroll the charts so they end at time tMs (smoothly between samples during playback). */
function updateChartWindow(tMs, force) {
  if (!charts.length || tMs == null || isNaN(tMs)) return;
  const now = performance.now();
  if (!force && now - lastChartDraw < 45) return;   // about 20 updates a second is plenty
  lastChartDraw = now;
  charts.forEach((u) => {
    u._m.tNow = tMs / 1000;
    const xs = u.data[0];
    const min = CHART_WIN === "all" ? xs[0] : tMs / 1000 - +CHART_WIN;
    const max = CHART_WIN === "all" ? xs[xs.length - 1] : tMs / 1000;
    if (u.scales.x.min !== min || u.scales.x.max !== max) u.setScale("x", { min, max });
    else u.redraw(false, false);
    showAt(u);
  });
}

// ================================================================ moment view
const TILE_KEYS = ["SPEED", "ENGINE_RPM", "gear", "COOLANT_TEMP", "ENGINE_LOAD", "THROTTLE", "SHORT_FUEL_TRIM", "LONG_FUEL_TRIM", "MODULE_VOLTAGE"];

function renderMoment(src) {
  $("tiles").innerHTML = TILE_KEYS.map((k) => {
    if (k === "gear") return `<div class="tile"><div><span class="v">${src.gear || "–"}</span></div><div class="l">Gear</div></div>`;
    if (!PID[k]) return "";
    const v = src.get(k), st = status(k, v);
    const cls = st === 2 ? "crit" : st === 1 ? "warn" : "";
    const tag = st ? `<span class="tag ${cls}" title="Normal ${rangeTxt(k)}">${v < PID[k].low ? "LOW" : "HIGH"}</span>` : "";
    return `<div class="tile ${cls}"><div><span class="v">${fmt(k, v)}</span><span class="u">${unit(k)}</span></div><div class="l">${PID[k].label}${tag}</div></div>`;
  }).join("");
  let html = "", grp = "";
  META.pids.forEach((p) => {
    const v = src.get(p.key);
    if (v == null || isNaN(v)) return;
    if (p.group !== grp) { grp = p.group; html += `<tr class="grp"><td colspan="3">${grp}</td></tr>`; }
    const off = status(p.key, v);
    html += `<tr class="${off ? "off" : ""}"><td>${p.label}${off ? (v < p.low ? " · low" : " · high") : ""}</td><td class="n">${fmt(p.key, v)} ${unit(p.key)}</td><td class="r">${rangeTxt(p.key)}</td></tr>`;
  });
  $("allTbl").innerHTML = html || '<tr><td class="muted">No readings.</td></tr>';
}


// ================================================================ playback
function seek(i, jump) {
  if (!DATA) return;
  const prev = POS;
  POS = Math.max(RANGE[0], Math.min(RANGE[1], i | 0));
  $("scrub").value = POS;
  $("clock").textContent = whenAt(POS);
  const c = DATA.cols;
  renderMoment({ get: (k) => (c[k] ? c[k][POS] : NaN), gear: DATA.gearC[POS] });
  // Flash a gear change only while playing forward, not when jumping around the timeline.
  const stepped = !jump && POS > prev && POS - prev <= 120;
  const dt = POS > RANGE[0] ? Math.max(1, (DATA.t[POS] - DATA.t[POS - 1]) / 1000) : 1;
  const decel = POS > RANGE[0] && c.SPEED ? (c.SPEED[POS - 1] - c.SPEED[POS]) / dt : 0;   // km/h lost per second
  updateHud(c.SPEED ? c.SPEED[POS] : NaN, c.ENGINE_RPM ? c.ENGINE_RPM[POS] : NaN, DATA.gearC[POS], stepped ? DATA.gearC[prev] : DATA.gearC[POS],
    accelFrac(c.PEDAL_D ? c.PEDAL_D[POS] : NaN, DATA.pedal, c.THROTTLE ? c.THROTTLE[POS] : NaN), decel);
  if (c.lat && c.lng && !isNaN(c.lat[POS])) {
    const braking = decel > 2;
    CAR_ALT = altNear(POS);
    placeCar(c.lat[POS], c.lng[POS], DATA.head[POS], braking, !stepped);
  }
  gpsNotice(POS);
  updateChartWindow(DATA.t[POS], !playing);
}

/** Between samples, slide the car (and the chase camera) smoothly instead of hopping once a second. */
function glide(i, f) {
  const c = DATA.cols;
  if (!c.lat || !c.lng || i >= RANGE[1] || !carShown) return;
  const la0 = c.lat[i], lo0 = c.lng[i], la1 = c.lat[i + 1], lo1 = c.lng[i + 1];
  if (isNaN(la0) || isNaN(la1)) return;
  const h0 = DATA.head[i], h1 = DATA.head[i + 1];
  const h = isNaN(h0) ? h1 : isNaN(h1) ? h0 : (h0 + angleDiff(h1, h0) * f + 360) % 360;
  placeCar(la0 + (la1 - la0) * f, lo0 + (lo1 - lo0) * f, h, carShown.braking);
}

let lastFrame = 0, acc = 0;
// A gap between rides ("Whole day") counts as one second, so playback doesn't sit out the hours in between.
const stepSec = (i) => { const s = (DATA.t[i + 1] - DATA.t[i]) / 1000; return s > 30 ? 1 : s; };
function frame(ts) {
  if (!playing) return;
  const dt = lastFrame ? Math.min(0.25, (ts - lastFrame) / 1000) : 0;
  lastFrame = ts;
  acc += dt * +$("rateSel").value;
  let i = POS;
  while (i < RANGE[1] && acc >= stepSec(i)) { acc -= stepSec(i); i++; }
  if (i !== POS) seek(i, i - POS > 120);
  if (POS >= RANGE[1]) { setPlaying(false); return; }
  const gap = (DATA.t[POS + 1] - DATA.t[POS]) / 1000 > 30;
  const f = gap ? 0 : Math.min(1, acc / Math.max(0.001, stepSec(POS)));
  if (!gap) glide(POS, f);
  updateChartWindow(DATA.t[POS] + f * stepSec(POS) * 1000);
  requestAnimationFrame(frame);
}
function setPlaying(p) {
  playing = p && !!DATA && !liveMode;
  $("playBtn").textContent = playing ? "Pause" : "Play";
  if (!playing) return;
  if (POS >= RANGE[1]) seek(RANGE[0], true);
  if (CAM !== "chase") setCam("chase");          // Play rides behind the car, like a driving game
  lastFrame = 0;
  acc = 0;
  requestAnimationFrame(frame);
}

// ================================================================ events
function findEvents() {
  const ev = [];
  const [a, b] = RANGE, c = DATA.cols;
  const add = (i, kind, sev, text) => ev.push({ i, kind, sev, text });
  let lastMil = DATA.mil[a], lastDtc = DATA.dtc[a];
  if (lastMil) add(a, "LIGHT", "warning", "Check-engine light was already on");
  if (lastDtc) add(a, "CODE", "warning", "Fault code stored: " + lastDtc);
  let hotDone = false, revDone = -999, lowV = false, brakeLast = -99, trimRun = 0, trimDone = false;
  for (let i = a + 1; i <= b; i++) {
    if (DATA.mil[i] !== lastMil) { add(i, "LIGHT", DATA.mil[i] ? "critical" : "good", "Check-engine light " + (DATA.mil[i] ? "came on" : "went off")); lastMil = DATA.mil[i]; }
    if (DATA.dtc[i] !== lastDtc) { add(i, "CODE", "serious", DATA.dtc[i] ? "Fault code: " + DATA.dtc[i] : "Fault codes cleared"); lastDtc = DATA.dtc[i]; }
    if (!hotDone && c.COOLANT_TEMP && c.COOLANT_TEMP[i] > 105) { hotDone = true; add(i, "TEMP", "critical", "Coolant above 105 °C (" + fmt("COOLANT_TEMP", c.COOLANT_TEMP[i]) + " " + unit("COOLANT_TEMP") + ")"); }
    if (c.ENGINE_RPM && c.ENGINE_RPM[i] > 5000 && i - revDone > 60) { revDone = i; add(i, "REVS", "warning", "High revs: " + Math.round(c.ENGINE_RPM[i]) + " rpm"); }
    if (!lowV && c.MODULE_VOLTAGE && c.ENGINE_RPM && c.ENGINE_RPM[i] > 500 && c.MODULE_VOLTAGE[i] < 13) { lowV = true; add(i, "VOLTS", "warning", "Charging low: " + c.MODULE_VOLTAGE[i].toFixed(1) + " V with the engine running"); }
    if (c.SPEED && !isNaN(c.SPEED[i]) && !isNaN(c.SPEED[i - 1])) {
      const dt = Math.max(0.5, (DATA.t[i] - DATA.t[i - 1]) / 1000);
      if ((c.SPEED[i - 1] - c.SPEED[i]) / dt > 12 && i - brakeLast > 10) { brakeLast = i; add(i, "BRAKE", "serious", "Hard braking: " + fmt("SPEED", c.SPEED[i - 1]) + " → " + fmt("SPEED", c.SPEED[i]) + " " + unit("SPEED")); }
    }
    if (c.SHORT_FUEL_TRIM && c.LONG_FUEL_TRIM) {
      const tot = c.SHORT_FUEL_TRIM[i] + c.LONG_FUEL_TRIM[i];
      trimRun = Math.abs(tot) > 15 ? trimRun + 1 : 0;
      if (!trimDone && trimRun >= 20) { trimDone = true; add(i, "FUEL", "warning", "Fuel trims " + (tot > 0 ? "lean" : "rich") + " for 20 s+ (total " + tot.toFixed(0) + "%)"); }
    }
  }
  if (c.COOLANT_TEMP && DATA.t[b] - DATA.t[a] > 15 * 60000) {
    let mx = -99;
    for (let i = a; i <= b; i++) if (c.COOLANT_TEMP[i] > mx) mx = c.COOLANT_TEMP[i];
    if (mx > -99 && mx < 80) add(b, "TEMP", "warning", "Engine never warmed up (max " + fmt("COOLANT_TEMP", mx) + " " + unit("COOLANT_TEMP") + "): thermostat may be stuck open");
  }
  ev.sort((x, y) => x.i - y.i);
  EVENTS = ev;
  $("events").innerHTML = ev.length
    ? ev.map((e) => `<button type="button" class="ev" data-i="${e.i}"><span class="tm">${whenAt(e.i)}</span><span class="k" style="color:var(--${e.sev})">${e.kind}</span><span>${e.text}</span></button>`).join("")
    : '<span class="muted">Nothing unusual in this ride.</span>';
  document.querySelectorAll("#events .ev").forEach((el) => (el.onclick = () => seek(+el.dataset.i, true)));
}

// ================================================================ summary
function rideStats() {
  const [a, b] = RANGE, c = DATA.cols;
  let moving = 0, vmax = 0, rpmMax = 0, cool = -99, fuel = 0, vMin = 99, vMax = 0, idleSum = 0, idleN = 0, span = 0;
  for (let i = a + 1; i <= b; i++) {
    const gap = DATA.t[i] - DATA.t[i - 1];
    if (gap <= 180000) span += gap;   // a longer gap is the time between two rides
    const dt = Math.min(5, gap / 1000);
    if (c.SPEED && c.SPEED[i] > 2) moving += dt;
    if (c.SPEED && c.SPEED[i] > vmax) vmax = c.SPEED[i];
    if (c.ENGINE_RPM && c.ENGINE_RPM[i] > rpmMax) rpmMax = c.ENGINE_RPM[i];
    if (c.ENGINE_RPM && c.SPEED && c.SPEED[i] < 1 && i - a > 300) { idleSum += c.ENGINE_RPM[i]; idleN++; }
    if (c.COOLANT_TEMP && c.COOLANT_TEMP[i] > cool) cool = c.COOLANT_TEMP[i];
    if (c.MAF && !isNaN(c.MAF[i])) fuel += c.MAF[i] / (14.7 * 745) * dt;
    if (c.MODULE_VOLTAGE && c.ENGINE_RPM && c.ENGINE_RPM[i] > 500) { vMin = Math.min(vMin, c.MODULE_VOLTAGE[i]); vMax = Math.max(vMax, c.MODULE_VOLTAGE[i]); }
  }
  const d = dist(a, b);
  return { mins: span / 60000, moving, vmax, rpmMax, cool, fuel, d, avg: moving > 0 ? d / (moving / 3600) : 0,
    vMin, vMax, idle: idleN ? idleSum / idleN : 0 };
}
/** Gear changes (up / down, ignoring neutral between them) and time spent in each gear for the selected ride. */
function gearStats() {
  const [a, b] = RANGE, time = {};
  let up = 0, down = 0, last = 0;
  for (let i = a + 1; i <= b; i++) {
    const gap = DATA.t[i] - DATA.t[i - 1];
    if (gap > 180000) last = 0;   // a new ride: no gear change across the gap
    const dt = Math.min(5, gap / 1000);
    const g = DATA.gearC[i];
    if (g) time[g] = (time[g] || 0) + dt;
    const n = +g;
    if (n >= 1) { if (last && n !== last) { if (n > last) up++; else down++; } last = n; }
  }
  return { time, up, down };
}

function summary() {
  const s = rideStats(), gs = gearStats();
  const econ = imperial() ? (s.fuel > 0 ? (s.d / (s.fuel / 4.54609)).toFixed(1) + " mpg" : "--") : (s.d > 0 ? (s.fuel / s.d * 100).toFixed(1) + " L/100km" : "--");
  const gears = ["N", "1", "2", "3", "4", "5", "6"].filter((k) => gs.time[k] > 0);
  const numeric = gears.filter((k) => k !== "N");
  const most = numeric.length ? numeric.reduce((x, y) => (gs.time[y] > gs.time[x] ? y : x)) : null;
  const changes = gs.up + gs.down;
  const items = [
    ["Duration", s.mins.toFixed(0) + " min"], ["Distance", s.d.toFixed(1) + " " + distUnit()],
    ["Average (moving)", s.avg.toFixed(0) + " " + unit("SPEED")], ["Top speed", fmt("SPEED", s.vmax) + " " + unit("SPEED")],
    ["Max RPM", s.rpmMax ? Math.round(s.rpmMax) : "--"], ["Max coolant", s.cool > -99 ? fmt("COOLANT_TEMP", s.cool) + " " + unit("COOLANT_TEMP") : "--"],
    ["Fuel used (est.)", s.fuel ? s.fuel.toFixed(2) + " L" : "--"], ["Economy (est.)", econ],
    ["Gear changes", changes ? changes + `<small> (${gs.up} up, ${gs.down} down)</small>` : numeric.length ? "0" : "--"], ["Most used gear", most || "--"],
  ];
  let html = items.map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
  const total = gears.reduce((t, k) => t + gs.time[k], 0);
  if (total > 0) {
    const pct = (k) => Math.round((100 * gs.time[k]) / total);
    const desc = gears.map((k) => (k === "N" ? "neutral" : "gear " + k) + " " + pct(k) + "%").join(", ");
    html += `<div class="wide"><span>Time in each gear (N = neutral or clutch down)</span>
      <div class="gearbar" role="img" aria-label="Time in each gear: ${desc}">${gears.map((k) => `<i style="flex:${gs.time[k].toFixed(1)} 0 0;background:${gearColor(k)}"></i>`).join("")}</div>
      <div class="gearkey">${gears.map((k) => `<span><b>${k}</b>${pct(k)}%</span>`).join("")}</div></div>`;
  }
  $("summary").innerHTML = html;
}


// ================================================================ AI
const QUICK = ["Why did the engine light come on?", "Is my thermostat OK?", "Any signs of misfire or fuel problems?", "Is the battery charging OK?", "How was my driving?"];
const escapeHtml = (s) => s.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));

/** Example answers for the preview, written from the sample ride's own numbers. */
function sampleAnswer(question) {
  const q = (question || "").toLowerCase();
  const s = rideStats();
  const cool = fmt("COOLANT_TEMP", s.cool) + " " + unit("COOLANT_TEMP");
  const light = EVENTS.find((e) => e.kind === "LIGHT" && e.sev === "critical");
  const brake = EVENTS.find((e) => e.kind === "BRAKE");
  const revs = EVENTS.find((e) => e.kind === "REVS");
  let a;
  if (/battery|charg|volt/.test(q)) {
    a = `**Charging looks healthy.** With the engine running the battery read ${s.vMin.toFixed(1)}–${s.vMax.toFixed(1)} V, inside the normal 13.5–14.7 V. No sign of a weak alternator or battery.`;
  } else if (/misfire|fuel|trim|o2|lambda/.test(q)) {
    a = `**No misfire or fuel problems in this ride.** Idle stayed steady around ${Math.round(s.idle)} rpm, the short fuel trim moved within about ±3% and the long trim sat near +4% (normal is within ±10%). The front O2 sensor kept switching between about 0.1 and 0.85 V, which is what a healthy sensor does.`;
  } else if (/driv|brake|smooth/.test(q)) {
    a = `${s.d.toFixed(1)} ${distUnit()} in ${s.mins.toFixed(0)} minutes, averaging ${s.avg.toFixed(0)} ${unit("SPEED")} while moving, top speed ${fmt("SPEED", s.vmax)} ${unit("SPEED")}.` +
      (brake ? ` One hard stop at ${fmtClock(DATA.t[brake.i])} (${brake.text.replace("Hard braking: ", "")}).` : " No harsh braking.") +
      (revs ? ` Revs went over 5000 rpm at ${fmtClock(DATA.t[revs.i])}; changing up earlier saves fuel.` : " Gear changes were in a sensible rev range.");
  } else {
    a = `**Most likely a thermostat stuck open (code P0128).** Coolant only reached ${cool} after ${s.mins.toFixed(0)} minutes of driving; a warm Meriva sits at 85–105 °C.` +
      (light ? ` The car logged P0128 ("coolant below thermostat regulating temperature") and the engine light came on at ${fmtClock(DATA.t[light.i])}.` : " The P0128 code is stored.") +
      `\n\nFuel trims, O2 sensors and charging all look normal, so the engine itself is fine.\n\nWhat to do: it's safe to keep driving, but fuel economy and the heater suffer and the light will stay on. Have the thermostat replaced; it's a common job on this engine. If the temperature still stays low afterwards, check the coolant temperature sensor.`;
  }
  return a;
}

async function ask(question) {
  if (!DATA) return;
  $("answer").textContent = "Thinking… reading " + (RANGE[1] - RANGE[0] + 1) + " seconds of data";
  $("askBtn").disabled = $("analyseBtn").disabled = true;
  try {
    const files = filesFor(RANGE[0], RANGE[1]);
    const j = await SRC.ask({ file: files[0], files, from: DATA.t[RANGE[0]], to: DATA.t[RANGE[1]], question });
    $("answer").innerHTML = escapeHtml(j.answer || "No answer.").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") +
      (MOCK ? '<span class="src">Example answer from the sample ride. On your phone, the AI provider you set in the app writes this from your real data.</span>' : "");
  } catch (e) {
    $("answer").textContent = "Couldn't reach the phone. Check it's on the same Wi-Fi and the app is open.";
  } finally {
    $("askBtn").disabled = $("analyseBtn").disabled = false;
  }
}


// ================================================================ live
const LIVE = { t: [], cols: {} };
const LIVE_MAX = { rpm: 0, cool: -99 };

/** Live: the summary card shows this trip so far (the phone keeps the totals), not the last replayed ride. */
function liveSummary(s) {
  const tr = s.trip, r = s.readings || {};
  if (r.ENGINE_RPM > LIVE_MAX.rpm) LIVE_MAX.rpm = r.ENGINE_RPM;
  if (r.COOLANT_TEMP > LIVE_MAX.cool) LIVE_MAX.cool = r.COOLANT_TEMP;
  if (!tr) {
    $("summary").innerHTML = '<div class="wide"><span>The trip totals appear here once the phone is connected to the car.</span></div>';
    return;
  }
  const km = tr.km || 0, d = imperial() ? km / 1.609344 : km, fuel = tr.fuelL || 0;
  const econ = fuel > 0.05 && km > 0.5
    ? (imperial() ? (d / (fuel / 4.54609)).toFixed(1) + " mpg" : ((fuel / km) * 100).toFixed(1) + " L/100km") : "--";
  const items = [
    ["Duration", Math.round((tr.sec || 0) / 60) + " min"], ["Distance", d.toFixed(1) + " " + distUnit()],
    ["Average (moving)", fmt("SPEED", tr.avgKmh || 0) + " " + unit("SPEED")], ["Top speed", fmt("SPEED", tr.maxKmh || 0) + " " + unit("SPEED")],
    ["Max RPM", LIVE_MAX.rpm ? Math.round(LIVE_MAX.rpm) : "--"],
    ["Max coolant", LIVE_MAX.cool > -99 ? fmt("COOLANT_TEMP", LIVE_MAX.cool) + " " + unit("COOLANT_TEMP") : "--"],
    ["Fuel used (est.)", fuel ? fuel.toFixed(2) + " L" : "--"], ["Economy (est.)", econ],
  ];
  $("summary").innerHTML = items.map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
}
let liveLast = null, liveAnchor = null, liveReq = 0, liveShown = 0;
/** Keep the last 15 minutes of live readings for the scrolling charts. */
function pushLive(s) {
  LIVE.t.push(s.t);
  META.pids.forEach((p) => {
    const v = s.readings ? s.readings[p.key] : null;
    (LIVE.cols[p.key] = LIVE.cols[p.key] || []).push(v == null || isNaN(+v) ? null : +v);
  });
  let cut = 0;
  while (cut < LIVE.t.length && LIVE.t[cut] < s.t - 15 * 60000) cut++;
  if (cut) { LIVE.t.splice(0, cut); Object.keys(LIVE.cols).forEach((k) => LIVE.cols[k].splice(0, cut)); }
}

async function liveTick() {
  const id = ++liveReq;
  try {
    const s = await SRC.live();
    if (!liveMode || id < liveShown) return;   // Live switched off, or a newer reading is already shown
    liveShown = id;
    $("liveDot").style.background = s.connected ? (s.demo ? css("--warning") : css("--good")) : css("--critical");
    $("statusTxt").textContent = s.connected ? (s.demo ? "Live · demo data" : "Live from the car") : "The phone isn't connected to the car";
    $("clock").textContent = fmtClock(s.t);
    const r = s.readings || {};
    renderMoment({ get: (k) => r[k], gear: s.gear });
    liveSummary(s);
    let heading = liveLast ? liveLast.heading : NaN;
    if (s.lat != null && s.lng != null) {
      const moved = liveAnchor && metres(liveAnchor[0], liveAnchor[1], s.lat, s.lng) > 5;
      if (moved) heading = bearing(liveAnchor[0], liveAnchor[1], s.lat, s.lng);
      if (!liveAnchor || moved) liveAnchor = [s.lat, s.lng];
    }
    const braking = !!liveLast && r.SPEED != null && liveLast.sp != null && liveLast.sp - r.SPEED > 2;
    const decel = liveLast && liveLast.sp != null && r.SPEED != null ? liveLast.sp - r.SPEED : 0;   // readings arrive once a second
    const pedal = pedalRange((LIVE.cols.PEDAL_D || []).concat([r.PEDAL_D]));   // the last 15 minutes and now
    updateHud(r.SPEED, r.ENGINE_RPM, s.gear, liveLast ? liveLast.gear : s.gear, accelFrac(r.PEDAL_D, pedal, r.THROTTLE), decel);
    if (s.alt != null && !isNaN(s.alt)) { LIVE_ALTS.push(+s.alt); if (LIVE_ALTS.length > 30) LIVE_ALTS.shift(); CAR_ALT = median(LIVE_ALTS); }
    if (s.lat != null && s.lng != null) placeCar(s.lat, s.lng, heading, braking);
    liveLast = { heading, gear: s.gear, sp: r.SPEED };
    pushLive(s);
    if (!charts.length) drawCharts();
    else charts.forEach((u) => { const d = chartData(u._m.keys); u._m.refresh(d.slice(1)); u.setData(d, false); });
    updateChartWindow(s.t, true);
    $("events").innerHTML = s.mil || (s.dtc && s.dtc.length)
      ? `<div class="ev"><span class="tm">${fmtClock(s.t)}</span><span class="k" style="color:var(--critical)">LIGHT</span><span>Check-engine light ${s.mil ? "on" : "off"}${s.dtc && s.dtc.length ? " · " + s.dtc.join(", ") : ""}</span></div>`
      : '<span class="muted">No fault codes.</span>';
  } catch (e) {
    if (!liveMode) return;
    $("statusTxt").textContent = "Lost contact with the phone";
    $("liveDot").style.background = css("--critical");
  }
}

function setLive(on) {
  liveMode = on;
  gpsNotice(-1);
  $("liveBtn").classList.toggle("on", on);
  $("liveBtn").setAttribute("aria-pressed", String(on));
  clearInterval(liveTimer);
  liveLast = null;
  liveAnchor = null;
  liveShown = ++liveReq;   // ignore anything still on its way from before
  LIVE.t = [];
  LIVE.cols = {};
  LIVE_MAX.rpm = 0; LIVE_MAX.cool = -99;
  $("summaryTitle").textContent = on ? "This trip · live" : "Ride summary";
  windowSeg();
  if (on) {
    setPlaying(false);
    if (ENGINE) { ENGINE.setRoute([]); ENGINE.setLabels([]); ENGINE.setEvents([], () => {}); }
    $("speedLegend").innerHTML = "<span>Live position</span>";
    drawCharts();
    setCam("chase", true);
    liveTick();
    liveTimer = setInterval(liveTick, 1000);
  } else if (DATA) {
    selectRide();
  }
}

// ================================================================ start
(async function main() {
  if (MOCK) $("mockNote").hidden = false;
  try {
    META = await SRC.meta();
    META.pids.forEach((p) => (PID[p.key] = p));
    // Where the phone is now and its GPS height: the ground height for rides recorded before heights were saved.
    if (!MOCK) SRC.live().then((s) => {
      if (s && s.alt != null && !isNaN(s.alt) && s.lat != null) PHONE_FIX = { lat: +s.lat, lng: +s.lng, alt: +s.alt };
    }).catch(() => {});
  } catch (e) {
    $("statusTxt").textContent = "Couldn't reach the phone. Is the app open?";
    return;
  }
  buildGauge();
  setupMapControls();
  chartChips();
  windowSeg();
  QUICK.forEach((q) => {
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.textContent = q;
    c.onclick = () => { $("q").value = q; ask(q); };
    $("quickQs").appendChild(c);
  });
  $("askBtn").onclick = () => $("q").value.trim() && ask($("q").value.trim());
  $("analyseBtn").onclick = () => ask("Analyse this ride: how is the car doing, is anything wrong, and what should I check?");
  $("playBtn").onclick = () => setPlaying(!playing);
  $("scrub").oninput = (e) => seek(+e.target.value, true);
  $("daySel").onchange = (e) => { setLive(false); loadDay(e.target.value); };
  $("rideSel").onchange = () => { setLive(false); selectRide(); };
  $("liveBtn").onclick = () => setLive(!liveMode);
  document.addEventListener("keydown", (e) => {
    if (/TEXTAREA|INPUT|SELECT|BUTTON/.test(e.target.tagName)) return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    if (e.code === "ArrowRight") seek(POS + 10, true);
    if (e.code === "ArrowLeft") seek(POS - 10, true);
  });
  if ("ResizeObserver" in window) {
    new ResizeObserver(() => { if (!ENGINE) return; ENGINE.resize(); if (pendingFit) fitTo(pendingFit); }).observe($("map"));
  }
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawCharts, 200); });
  startMap();                      // loads in the background; the ride is drawn on it once it's ready
  if (await loadDays()) await loadDay($("daySel").value);
  else setLive(true);
})();
</script>
