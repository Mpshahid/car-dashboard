<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Dashboard Ride Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: sticky header band; desktop = replay column (map, player, charts) + readout column
     (moment, events, summary, AI); phones = one column in reading order with the player fixed at the bottom. */
  :root {
    color-scheme: dark;
    --bg: #0b0c10; --surface: #121318; --tile: #1a1c22; --line: #262833; --head: rgba(11, 12, 16, 0.94);
    --ink: #f1f2f5; --ink2: #b7bac4; --muted: #8b909c; --faint: #5f6470;
    --accent: #3d8bff; --accent-soft: rgba(61, 139, 255, 0.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --band: rgba(57, 135, 229, 0.10);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: "Space Grotesk", "Inter", system-ui, sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font: 14px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1001; background: var(--head); }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2 { text-wrap: balance; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--head);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px var(--gutter-r) 10px var(--gutter-l); }
  header h1 { font: 600 16px/1.2 var(--font-num); margin: 0 6px 0 0; letter-spacing: .01em; white-space: nowrap; }
  .pickers { display: flex; gap: 8px; flex: 1 1 420px; min-width: 0; }
  .pickers select { flex: 1 1 0; min-width: 0; }
  select, .btn { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); }
  .btn:disabled { opacity: .5; cursor: default; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-left: auto; min-width: 0; }
  .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .notice { padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--accent-soft); color: var(--ink2); font-size: 13px; border-bottom: 1px solid var(--line); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 14px var(--gutter-r) 40px var(--gutter-l); }
  main > section, main > aside { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .card h2 { font: 600 12px/1.2 var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .cardhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }

  /* ---------------------------------------------------------------- map */
  #mapCard { padding: 0; overflow: hidden; }
  #mapWrap { position: relative; isolation: isolate; }
  #map { height: 52vh; min-height: 320px; background: #14161b; }
  #map.nomap { display: grid; place-items: center; color: var(--muted); padding: 16px; text-align: center; }
  /* Liquid glass: frosted, saturated blur of the map behind, a bright rim and a soft sheen. */
  .glass { position: relative; border: 1px solid rgba(255, 255, 255, .22);
    background: linear-gradient(160deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .04) 40%, rgba(10, 12, 18, .3) 100%), rgba(10, 12, 18, .3);
    -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .45), inset 0 -1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .38); }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 70% at 18% 0%, rgba(255, 255, 255, .26), transparent 58%); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(18, 20, 26, .9); } }
  .mapbtns { position: absolute; top: 10px; left: 10px; z-index: 5; display: flex; flex-direction: column; border-radius: 16px; padding: 3px; gap: 2px;
    overflow: hidden; border: 1px solid var(--line); }
  .mapbtns button { position: relative; z-index: 1; width: 40px; height: 40px; background: transparent; color: var(--ink); border: 0; border-radius: 12px;
    font: 500 21px/1 var(--font); cursor: pointer; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
  .mapbtns button:hover { background: rgba(255, 255, 255, .1); }
  .mapbtns button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  /* Google's 3D map has no switch to turn its own dragging off: in Chase this layer takes the drags (orbit). */
  .orbitcatch { position: absolute; inset: 0; z-index: 2; touch-action: none; }
  .car3dlayer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #map gmp-map-3d { display: block; width: 100%; height: 100%; }
  /* One toolbar of game-style buttons: camera, 2D/3D, map/satellite, camera angle. */
  .mapdock { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 2px; padding: 3px; border-radius: 16px; }
  .dockbtn { position: relative; z-index: 1; width: 46px; height: 42px; border: 0; border-radius: 12px; background: transparent; color: var(--ink);
    display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer; font: 700 8px/1 var(--font); letter-spacing: .08em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55); transition: background .15s, color .15s, box-shadow .15s; }
  .dockbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .45)); }
  .dockbtn b { font: 700 15px/19px var(--font-num); letter-spacing: 0; }
  .dockbtn:hover { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .dockbtn[aria-pressed="true"], .dockbtn[aria-expanded="true"] { color: #fff;
    background: linear-gradient(180deg, rgba(110, 175, 255, .6), rgba(38, 112, 238, .5));
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55), inset 0 -2px 4px rgba(10, 40, 110, .35), 0 0 16px rgba(61, 139, 255, .5); }
  .dockbtn:disabled { color: rgba(255, 255, 255, .32); cursor: not-allowed; }
  .dockbtn:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  #camBtn .i-over, #camBtn[aria-pressed="true"] .i-chase { display: block; }
  #camBtn .i-chase, #camBtn[aria-pressed="true"] .i-over { display: none; }
  .anglemenu { position: absolute; top: 10px; right: 64px; z-index: 7; padding: 3px; border-radius: 15px; display: grid; grid-template-columns: 136px; gap: 2px; }
  .anglemenu[hidden] { display: none; }
  .anglemenu button { position: relative; z-index: 1; height: 32px; border: 0; border-radius: 11px; background: transparent; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 8px; padding: 0 10px; font: 600 12px/1 var(--font); letter-spacing: .01em; text-align: left; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
  .anglemenu button svg { flex: none; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .anglemenu button:hover { background: rgba(255, 255, 255, .1); color: var(--ink); }
  .anglemenu button[aria-checked="true"] { color: #fff; background: linear-gradient(180deg, rgba(110, 175, 255, .6), rgba(38, 112, 238, .5));
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55), 0 0 14px rgba(61, 139, 255, .45); }
  .anglemenu button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .mapmsg { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; width: min(calc(100% - 136px), 460px);
    padding: 8px 12px; border-radius: 10px; background: rgba(11, 12, 16, .9); border: 1px solid var(--line); color: var(--ink2); font-size: 12px; }
  .mapmsg[hidden] { display: none; }
  #mapMsg:not([hidden]) ~ #gpsMsg { top: 74px; }
  .mapfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; padding: 9px 12px;
    font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .mapfoot .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .mapfoot a { color: var(--muted); }
  .ramp { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .ramp i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { background: var(--tile); border: 0; padding: 8px 13px; font-size: 12px; color: var(--ink2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 999px; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; background: var(--sw); }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }

  /* The car (top view in Overview, rear view in Chase), gear labels and event dots. */
  .carwrap { pointer-events: none; }
  #map.chasing { touch-action: none; cursor: grab; }
  #map.chasing:active { cursor: grabbing; }
  .carwrap .car { width: 44px; height: 44px; display: grid; place-items: center; transition: transform .35s ease-out; }
  .carwrap svg { overflow: visible; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .75)); }
  .carwrap .tail { fill: #8f2a2a; }
  .carwrap.brake .tail { fill: #ff453a; filter: drop-shadow(0 0 4px #ff453a); }
  .carwrap .car-rear { display: none; }
  .carwrap.chase .car-top { display: none; }
  .carwrap.chase .car-rear { display: block; }
  .carwrap.g:not(.chase) { transform: translateY(50%); }   /* Google anchors marker content at its bottom centre */
  .gmk { transform: translateY(50%); }
  .carwrap.sprite .car { transition: none; }
  .carwrap.sprite img { display: block; height: 100%; width: auto; }
  .glab { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
    background: rgba(11, 12, 16, .9); border: 1.5px solid var(--c, var(--accent)); color: var(--ink); font: 600 11px/1 var(--font-num); }
  .evdot { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0b0c10; cursor: pointer; }

  /* Game-style instrument cluster over the map: rev dial with speed and gear, shift lights, pedal bars.
     Bottom right, clear of Google's logo (bottom left) and terms row (very bottom). */
  .ghud { position: absolute; right: 10px; bottom: 30px; z-index: 6; pointer-events: none; display: grid; justify-items: center; gap: 6px; }
  .shiftlights { display: flex; gap: 5px; padding: 5px 8px; border-radius: 10px; }
  .shiftlights i { position: relative; z-index: 1; }
  .shiftlights i { width: 13px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .13); }
  .shiftlights i.on.g { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .shiftlights i.on.a { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
  .shiftlights i.on.r { background: var(--critical); box-shadow: 0 0 7px var(--critical); }
  .shiftlights.flash i.on { animation: shiftblink .24s steps(2) infinite; }
  @keyframes shiftblink { 50% { opacity: .25; } }
  .ghud-row { display: flex; align-items: flex-end; gap: 7px; }
  .gauge-box { position: relative; width: 172px; height: 172px; }
  /* Glass disc behind the dial: the map shows through, frosted, with a bright rim and a sheen top-left. */
  .gauge-box::before { content: ""; position: absolute; inset: 1px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .24);
    background: radial-gradient(circle at 32% 18%, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 38%),
      radial-gradient(circle at 50% 52%, rgba(8, 10, 14, .62), rgba(8, 10, 14, .42) 70%, rgba(8, 10, 14, .3) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    box-shadow: inset 0 2px 3px rgba(255, 255, 255, .38), inset 0 -4px 8px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .45); }
  .gauge { position: relative; z-index: 1; width: 100%; height: 100%; display: block; overflow: visible; }
  .g-face { fill: rgba(6, 8, 12, .3); stroke: none; }
  #gaugeSegs path { fill: rgba(255, 255, 255, .08); }
  #gaugeSegs path.on { fill: #dbe8ff; }
  #gaugeSegs path.on.amber { fill: var(--warning); }
  #gaugeSegs path.on.red { fill: var(--critical); }
  .g-tick { fill: var(--muted); font: 600 11px var(--font-num); }
  .g-tick.red { fill: var(--critical); }
  .g-redline { fill: none; stroke: var(--critical); stroke-width: 3; stroke-linecap: round; }
  .g-speed, .g-rpm, .g-unit, .g-tick { paint-order: stroke; stroke: rgba(0, 0, 0, .5); stroke-width: 3px; stroke-linejoin: round; }
  .g-speed { fill: var(--ink); font: 600 52px var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .g-unit { fill: var(--muted); font: 600 11px var(--font); letter-spacing: .14em; }
  .g-rpm { fill: var(--ink2); font: 500 12px var(--font-num); font-variant-numeric: tabular-nums; }
  .g-gear { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; transition: background .2s, box-shadow .2s; z-index: 2; }
  .g-gear b { font: 700 23px/1 var(--font-num); }
  .g-gear em { position: absolute; top: -10px; right: -12px; padding: 3px 5px; border-radius: 8px; font: 700 12px/1 var(--font-num);
    font-style: normal; background: var(--accent); color: #fff; opacity: 0; transition: opacity .2s; }
  .g-gear.shift { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(61, 139, 255, .55); }
  .g-gear.shift em { opacity: 1; }
  .pedals { display: grid; grid-template-columns: 9px 9px; gap: 4px 5px; justify-items: center; padding: 8px 7px 6px; border-radius: 12px;
    background: rgba(11, 12, 16, .72); }
  .pedals > * { position: relative; z-index: 1; }
  .pedal { position: relative; width: 9px; height: 86px; border-radius: 5px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .pedal i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 5px; background: var(--s3); transition: height .12s linear; }
  .pedal.brake i { background: var(--s2); }
  .pedals small { font: 700 9px/1 var(--font); color: var(--muted); }

  .player { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .player input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); height: 28px; }
  .clock { font: 500 15px/1 var(--font-num); font-variant-numeric: tabular-nums; min-width: 84px; color: var(--ink2); text-align: right; }

  /* ---------------------------------------------------------------- charts */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 7px 11px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); cursor: pointer; font-size: 12px; color: var(--ink2); }
  .chip.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  .chart { margin-bottom: 16px; min-width: 0; }
  .chart:last-child { margin-bottom: 0; }
  .ttl { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 4px; min-width: 0; }
  .ttl b { font-weight: 600; }
  .ttl .stats { color: var(--muted); font-size: 12px; min-width: 0; }
  .ttl .read { color: var(--ink); font: 500 12px var(--font-num); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }

  /* ---------------------------------------------------------------- readouts */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--tile); border-radius: 12px; padding: 10px; min-width: 0; }
  .tile .v { font: 500 22px/1.15 var(--font-num); font-variant-numeric: tabular-nums; }
  .tile .u { color: var(--faint); font-size: 11px; margin-left: 3px; }
  .tile .l { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tile.warn .v { color: var(--warning); }
  .tile.crit .v { color: var(--critical); }
  .tag { font: 600 10px/1 var(--font); letter-spacing: .04em; padding: 3px 5px; border-radius: 5px; border: 1px solid currentColor; }
  .tag.warn { color: var(--warning); } .tag.crit { color: var(--critical); }
  details { margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 2px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.r { color: var(--faint); font-size: 11px; text-align: right; white-space: nowrap; padding-left: 8px; }
  tr.grp td { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 12px; border-bottom: none; }
  tr.off td.n { color: var(--warning); }

  .ev { display: grid; grid-template-columns: 64px auto 1fr; gap: 8px; align-items: baseline; padding: 8px 6px; border: 0;
    border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; background: none; width: 100%; text-align: left; color: var(--ink); }
  .ev:hover { background: var(--tile); }
  .ev .tm { color: var(--muted); font: 500 12px var(--font-num); font-variant-numeric: tabular-nums; }
  .ev .k { font: 600 10px/1 var(--font); letter-spacing: .05em; padding: 3px 6px; border-radius: 5px; border: 1px solid currentColor; white-space: nowrap; }
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .sum span { display: block; color: var(--muted); font-size: 12px; }
  .sum b { font: 500 18px/1.2 var(--font-num); font-variant-numeric: tabular-nums; }
  .sum b small { font: 400 12px var(--font); color: var(--muted); margin-left: 4px; }
  .sum .wide { grid-column: 1 / -1; }
  .gearbar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 6px; background: var(--surface); }
  .gearbar i { display: block; height: 100%; min-width: 2px; }
  .gearkey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .gearkey b { color: var(--ink); font: 600 12px var(--font-num); margin-right: 3px; }
  textarea { width: 100%; min-height: 72px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .answer { white-space: pre-wrap; background: var(--tile); border-radius: 12px; padding: 12px; margin-top: 10px; color: var(--ink2); overflow-wrap: anywhere; }
  .answer:empty { display: none; }
  .answer .src { display: block; margin-top: 10px; color: var(--faint); font-size: 12px; }
  .muted { color: var(--muted); }
  .empty { padding: 30px 10px; text-align: center; color: var(--muted); }

  /* Tablet and phone: one column in reading order. */
  @media (max-width: 980px) {
    main { display: flex; flex-direction: column; }
    main > section, main > aside { display: contents; }
    #mapCard { order: 1; } #playerCard { order: 2; } #momentCard { order: 3; } #chartsCard { order: 4; }
    #eventsCard { order: 5; } #summaryCard { order: 6; } #aiCard { order: 7; }
  }
  /* Phone: player fixed at the bottom, always in reach. */
  @media (max-width: 760px) {
    header h1 { font-size: 15px; }
    .pickers { flex-basis: 100%; order: 3; }
    #map { height: 46vh; min-height: 280px; }
    #playerCard { position: fixed; left: 0; right: 0; bottom: 0; z-index: 999; border-radius: 14px 14px 0 0; border-bottom: 0;
      padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: var(--head);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .player input[type=range] { order: 4; flex-basis: 100%; }
    .clock { margin-left: auto; }
    .tile .v { font-size: 19px; }
    .ghud { right: 8px; bottom: 26px; gap: 4px; }
    .gauge-box { width: 132px; height: 132px; }

<body>
<header>
  <div class="bar">
    <h1>Ride replay</h1>
    <div class="pickers">
      <select id="daySel" aria-label="Recorded day"></select>
      <select id="rideSel" aria-label="Ride"></select>
    </div>
    <button class="btn" id="liveBtn" type="button" aria-pressed="false">Live</button>
    <div class="status"><span class="dot" id="liveDot"></span><span id="statusTxt">Loading…</span></div>
  </div>
  <div class="notice" id="mockNote" hidden>Preview with a made-up sample ride. On your phone this page shows your real recordings on Google's 3D map.</div>
</header>

<main>
  <section>
    <div class="card" id="mapCard">
      <div id="mapWrap">
        <div id="map" role="img" aria-label="Map of the ride"></div>
        <div class="mapbtns glass" role="group" aria-label="Zoom">
          <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
          <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        </div>
        <div class="mapdock glass" role="toolbar" aria-label="Map view">
          <button type="button" class="dockbtn" id="camBtn" aria-pressed="false" title="Chase camera behind the car, or the whole route"><svg class="i-chase" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="12" rx="2.5"/><path d="M9.5 8h5M7 20l2-3M17 20l-2-3M12 21v-4"/></svg><svg class="i-over" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M7 14c2-3 4 1 6-2s3-2 4-1"/></svg><span id="camLbl">MAP</span></button>
          <button type="button" class="dockbtn" id="dimBtn" aria-pressed="true" title="3D map with buildings, or flat 2D"><b id="dimTxt">3D</b><span>VIEW</span></button>
          <button type="button" class="dockbtn" id="layerBtn" aria-pressed="false" title="Map or satellite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span id="layerLbl">MAP</span></button>
          <button type="button" class="dockbtn" id="angleBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="angleMenu" title="Camera angle (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3z"/></svg><span id="angleLbl">BEHIND</span></button>
        </div>
        <div class="anglemenu glass" id="angleMenu" role="menu" aria-label="Camera angle" hidden></div>
        <div class="mapmsg" id="mapMsg" role="status" hidden></div>
        <div class="mapmsg" id="gpsMsg" role="status" hidden></div>
        <div class="ghud" id="hud" aria-hidden="true">
          <div class="shiftlights glass" id="shiftLights"><i class="g"></i><i class="g"></i><i class="a"></i><i class="a"></i><i class="r"></i></div>
          <div class="ghud-row">
            <div class="gauge-box">
              <svg class="gauge" viewBox="0 0 200 200">
                <circle class="g-face" cx="100" cy="100" r="99"/>
                <g id="gaugeTicks"></g>
                <g id="gaugeSegs"></g>
                <text class="g-rpm" id="hudRpm" x="100" y="70" text-anchor="middle">-- rpm</text>
                <text class="g-speed" id="hudSpeed" x="100" y="117" text-anchor="middle">--</text>
                <text class="g-unit" id="hudUnit" x="100" y="136" text-anchor="middle">MPH</text>
              </svg>
              <div class="g-gear glass" id="hudGear"><b id="hudGearVal">–</b><em id="hudShift"></em></div>
            </div>
            <div class="pedals glass"><div class="pedal"><i id="thrBar"></i></div><div class="pedal brake"><i id="brkBar"></i></div><small>T</small><small>B</small></div>
          </div>
        </div>
      </div>
      <div class="mapfoot">
        <div class="ctl"><span>Colour route by</span><div class="seg" id="modeSeg" role="group" aria-label="Colour route by"></div></div>
        <div class="ctl"><span>Car</span><div class="swatches" id="swatches" role="group" aria-label="Car colour"></div></div>
        <div class="ramp" id="speedLegend"></div>
        <span id="mapNote"></span>
        <span id="mapAttr"></span>
      </div>
    </div>
    <div class="card" id="playerCard">
      <div class="player">
        <button class="btn primary" id="playBtn" type="button">Play</button>
        <select id="rateSel" aria-label="Playback speed">
          <option value="1">1×</option><option value="5">5×</option><option value="20" selected>20×</option>
          <option value="60">60×</option><option value="120">120×</option>
        </select>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline">
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </div>
    <div class="card" id="chartsCard">
      <div class="cardhead"><h2>Charts</h2><div class="seg" id="winSeg" role="group" aria-label="Chart time window"></div></div>
      <div class="chips" id="chartChips"></div>
      <div id="charts"></div>
    </div>
  </section>

  <aside>
    <div class="card" id="momentCard">
      <h2 style="margin-bottom:10px">At this moment</h2>
      <div class="grid" id="tiles"></div>
      <details><summary>All readings</summary><div class="tablewrap"><table id="allTbl"></table></div></details>
    </div>
    <div class="card" id="eventsCard">
      <h2 style="margin-bottom:10px">Events</h2>
      <div id="events" class="muted">—</div>
    </div>
    <div class="card" id="summaryCard">
      <h2 style="margin-bottom:10px" id="summaryTitle">Ride summary</h2>
      <div class="sum" id="summary"></div>
    </div>
    <div class="card" id="aiCard">
      <h2 style="margin-bottom:10px">Ask the AI about this ride</h2>
      <div class="chips" id="quickQs"></div>
      <textarea id="q" placeholder="e.g. Why did the engine light come on? Is my thermostat OK?"></textarea>
      <div class="row">
        <button class="btn primary" id="askBtn" type="button">Ask</button>
        <button class="btn" id="analyseBtn" type="button">Analyse this ride</button>
      </div>
      <div class="answer" id="answer" aria-live="polite"></div>
    </div>
  </aside>
</main>

/**
 * Gear from engine speed ÷ road speed, worked out the same way as the phone's dashboard (GearEstimator.kt: keep the
 * two in step). The car is a five-speed manual; the figures are its rpm per km/h in each gear, measured from its own
 * drives. With the clutch down the engine idles while the car rolls on, so at idle speed a gear only counts if the rpm
 * followed the road speed. A new gear shows once two readings agree, or at once if it's a clear match straight after
 * neutral or the clutch (a gear change); readings that keep disagreeing show neutral.
 * Returns a function (time ms, km/h, rpm) → gear 1-5, or 0 for neutral; use a new one for each ride.
 */
const GEAR_RATIOS = [129.5, 66.9, 44.8, 31.95, 25.36];
function gearTracker() {
  const hist = [];
  let shown = 0, cand = -1, candAt = 0, since = -1, idle = 850;
  /** The gear these readings point to (0 = neutral), and whether it's a clear match well above idle speed. */
  function classify(kmh, rpm, at) {
    if (!(rpm >= 500)) return [0, false];                                    // engine off
    if (!(kmh >= 3)) {
      if (kmh < 0.5 && rpm < 1600) idle += (rpm - idle) * 0.1;               // standing still: learn the idle speed
      return [0, false];
    }
    const r = rpm / kmh;
    let best = 0;
    for (let i = 0; i < GEAR_RATIOS.length; i++) {
      if (Math.abs(Math.log(r / GEAR_RATIOS[i])) < Math.abs(Math.log(r / GEAR_RATIOS[best]))) best = i;
    }
    const off = Math.abs(r / GEAR_RATIOS[best] - 1);
    if (off > 0.07 + 0.6 / kmh) return [0, false];        // no gear (speed comes in whole km/h, so allow more when slow)
    const g = best + 1;
    if (rpm > Math.max(1150, idle + 300)) return [g, off <= 0.05];
    const p = hist.find((h) => at - h.at >= 800 && at - h.at <= 2600 && h.kmh >= 3 && h.rpm >= 500);
    if (!p) return [shown === g ? g : 0, false];
    const dv = Math.log(kmh / p.kmh), dr = Math.log(rpm / p.rpm);
    if (Math.abs(kmh - p.kmh) >= 2) return [Math.abs(dr - dv) < 0.5 * Math.abs(dv) ? g : 0, false];
    if (Math.abs(dr) > 0.06) return [0, false];                              // the rpm moved on its own: the clutch
    return [shown === g ? g : 0, false];
  }
  return function (at, kmh, rpm) {
    const prev = hist[hist.length - 1];
    if (prev && prev.kmh === kmh && prev.rpm === rpm) return shown;           // the same reading again (not refreshed)
    const [raw, sure] = classify(kmh, rpm, at);
    hist.push({ at, kmh, rpm });
    while (at - hist[0].at > 3000) hist.shift();
    if (raw === shown) { since = -1; cand = -1; }
    else if (sure && (shown === 0 || cand === 0)) { shown = raw; since = -1; cand = -1; }   // clear gear after the clutch

      else if (at - since >= 400) { shown = 0; since = -1; }                  // still disagreeing, and with each other
    }

/** Values a car sends when it has no real reading (every bit set), e.g. speed 255 km/h as the ignition goes off. */
const NO_READING = { SPEED: 255, ENGINE_RPM: 16383, COOLANT_TEMP: 215, INTAKE_TEMP: 215, OIL_TEMP: 215, AMBIENT_TEMP: 215 };

/** Tidy a recording: drop "no reading" values, and GPS positions that had stopped updating. */
function cleanReadings(cols, t) {
  const n = t.length;
  for (const k in NO_READING) {

  // off screen): a position that stays exactly the same while the car drives on is stale, so it's dropped.
  const la = cols.lat, lo = cols.lng, sp = cols.SPEED;
  if (!la || !lo || !sp) return;
  for (let i = 0; i < n; ) {
    let j = i + 1, moving = 0;
    while (j < n && la[j] === la[i] && lo[j] === lo[i] && t[j] - t[j - 1] <= 180000) { if (sp[j] > 8) moving++; j++; }
    if (!isNaN(la[i]) && moving >= 15) {
      for (let k = i + 1; k < j; k++) {
        la[k] = NaN; lo[k] = NaN;

    }

function gpsGaps() {

function metres(lat1, lng1, lat2, lng2) {

    if (i > 0 && DATA.t[i] - DATA.t[i - 1] > 180000) { aLat = NaN; aLng = NaN; last = NaN; }   // a new ride starts
    const la = lat[i], lo = lng[i];
    if (!isNaN(la) && !isNaN(lo)) {
      const moving = sp ? sp[i] > 3 : true;
      const far = !isNaN(aLat) && metres(aLat, aLng, la, lo) > 8;
      if (hd && !isNaN(hd[i]) && moving) last = hd[i];
      else if (far && moving) last = bearing(aLat, aLng, la, lo);   // parked: GPS drift mustn't turn the car
      if (isNaN(aLat) || (far && moving)) { aLat = la; aLng = lo; }

    ray.set(new THREE.Vector3(x, y, fromFront ? HL + 1 : -HL - 1), new THREE.Vector3(0, 0, fromFront ? -1 : 1));

    const y = 0.5, z0 = surfaceZ(0, y - 0.04, true), z1 = surfaceZ(0, y + 0.04, true);

    group,

/**
 * Reflection environment for the car: dark ground, grey horizon, soft sky and three soft light panels,
 * so the paint and glass get Tesla-style highlights without white blow-outs. Returns a PMREM texture.

function makeCarEnvironment(THREE, renderer) {
  const scene = new THREE.Scene();
  const geo = new THREE.SphereGeometry(50, 48, 24);
  const ground = new THREE.Color("#0f1115"), horizon = new THREE.Color("#3b4352"), sky = new THREE.Color("#8e9cb2");
  const c = new THREE.Color(), cols = [], p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 50;
    if (y > 0) c.copy(horizon).lerp(sky, Math.pow(y, 0.6));
    else c.copy(horizon).lerp(ground, Math.pow(-y, 0.35));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    scene.add(m);
  };
  panel(36, 7, 0, 44, 4, 2.2);
  panel(22, 5, 34, 18, 22, 1.1);
  panel(22, 5, -34, 16, -24, 0.9);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(scene, 0.035).texture;
  pmrem.dispose();
  scene.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return tex;
}

/** How much to enlarge the car so it's never shorter than CAR_MIN_PX on screen (true size when close). */
const carScaleFor = (metresPerPx) => Math.max(1, (CAR_MIN_PX * metresPerPx) / CAR_LEN);

/** Next 3D-car state from a map position: keeps the last heading when there isn't one, and adds up wheel travel. */
function car3dState(prev, st) {
  const moved = prev ? metres(prev.lat, prev.lng, st.lat, st.lng) : 0;
  const head = st.heading != null && !isNaN(st.heading) ? st.heading : prev ? prev.heading : 0;
  return {
    lat: st.lat, lng: st.lng, heading: head, braking: !!st.braking, color: CAR_COLOR, scale: 1,
    spin: (prev ? prev.spin : 0) + (moved < 60 ? moved : 0),

}

function loadScript(src) {

    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.onload = () => ok();
    s.onerror = () => fail(new Error("Couldn't load " + src));

/**
 * Google's 3D map camera (looking at `center` from `range` metres away; tilt 0 = straight down, heading 0 = north)
 * as a projection × view matrix (column-major) for east/north/up metres around the car's ground point.
 */
function camera3d(c, range, tiltDeg, headingDeg, fovDeg, aspect, car, carAlt) {
  const R = 6378137, la = (car.lat * Math.PI) / 180;
  const cx = (((c.lng - car.lng) * Math.PI) / 180) * R * Math.cos(la), cy = (((c.lat - car.lat) * Math.PI) / 180) * R;
  const cz = (c.altitude || 0) - carAlt;
  const h = (headingDeg * Math.PI) / 180, t = (tiltDeg * Math.PI) / 180;
  const d = [Math.sin(h) * Math.sin(t), Math.cos(h) * Math.sin(t), -Math.cos(t)];            // view direction
  const eye = [cx - range * d[0], cy - range * d[1], cz - range * d[2]];
  const up0 = Math.abs(d[2]) > 0.999 ? [Math.sin(h), Math.cos(h), 0] : [0, 0, 1];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  let r = cross(d, up0);
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, r[2] / rl];
  const u = cross(r, d);
  const V = [r[0], u[0], -d[0], 0, r[1], u[1], -d[1], 0, r[2], u[2], -d[2], 0, -dot(r, eye), -dot(u, eye), dot(d, eye), 1];
  const near = Math.max(0.5, range * 0.02), far = range * 60 + 3000, f = 1 / Math.tan((fovDeg * Math.PI) / 360);
  const P = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, (2 * far * near) / (near - far), 0];
  const M = new Array(16);
  for (let col = 0; col < 4; col++) for (let row = 0; row < 4; row++) {
    let v = 0;
    for (let k = 0; k < 4; k++) v += P[k * 4 + row] * V[col * 4 + k];
    M[col * 4 + row] = v;
  }
  return M;
}

/** On a narrow map the instrument cluster covers the right half: Chase keeps the car in the space beside it. */
function chaseSideRoom() {
  const m = $("map"), h = $("hud");
  return m.clientWidth < 700 ? Math.round(h.getBoundingClientRect().width + 16) : 0;
}

/** Padding when framing the route: room for the buttons (top) and the instrument cluster, on whichever side costs less. */
function fitPad() {
  const m = $("map").getBoundingClientRect(), h = $("hud").getBoundingClientRect();
  const side = { top: 60, left: 56, right: Math.round(h.width) + 26, bottom: 40 };
  const below = { top: 60, left: 56, right: 30, bottom: Math.round(h.height) + 34 };
  const area = (p) => Math.max(0, m.width - p.left - p.right) * Math.max(0, m.height - p.top - p.bottom);
  return area(side) >= area(below) ? side : below;

function fitTo(bounds) {
  if (!ENGINE) return;
  // A ride that hardly moved would zoom in to the rooftops: frame at least ~400 m.
  const cLat = (bounds[0][0] + bounds[1][0]) / 2, cLng = (bounds[0][1] + bounds[1][1]) / 2;
  const hLat = Math.max((bounds[1][0] - bounds[0][0]) / 2, 0.0018), hLng = Math.max((bounds[1][1] - bounds[0][1]) / 2, 0.0018 / Math.cos((cLat * Math.PI) / 180));
  bounds = [[cLat - hLat, cLng - hLng], [cLat + hLat, cLng + hLng]];
  if (ENGINE.size() < 100) { pendingFit = bounds; return; }   // a background tab has no size yet: fit once it's laid out
  pendingFit = null;
  ENGINE.fit(bounds);
}

// ================================================================ map drawing + camera
/** Route pieces coloured by the selected mode; breaks at GPS gaps and between rides. */
function routeSegments() {
  const lat = DATA.cols.lat, lng = DATA.cols.lng, segs = [];
  if (!lat || !lng) return segs;
  let cur = null, prev = null;
  for (let i = RANGE[0]; i <= RANGE[1]; i++) {
    if (isNaN(lat[i]) || isNaN(lng[i]) || (i > RANGE[0] && DATA.t[i] - DATA.t[i - 1] > 180000)) { cur = null; prev = null; if (isNaN(lat[i]) || isNaN(lng[i])) continue; }
    const p = [lat[i], lng[i]], c = routeColor(i);
    if (!cur || cur.color !== c) { cur = { color: c, path: prev ? [prev, p] : [p] }; segs.push(cur); }
    else cur.path.push(p);
    prev = p;
  }
  return segs.filter((s) => s.path.length > 1);
}

/** Gear mode: the gear number at the middle of every stretch held for 25 s or more (selective labels). */
function gearLabelItems() {
  const lat = DATA.cols.lat, lng = DATA.cols.lng, out = [];
  if (!lat || !lng) return out;
  let start = RANGE[0];
  for (let i = RANGE[0] + 1; i <= RANGE[1] + 1; i++) {
    if (i <= RANGE[1] && DATA.gearC[i] === DATA.gearC[start]) continue;
    const g = +DATA.gearC[start];
    if (g >= 1 && DATA.t[i - 1] - DATA.t[start] >= 25000 && out.length < 80) {
      const m = (start + i - 1) >> 1;
      if (!isNaN(lat[m]) && !isNaN(lng[m])) out.push({ lat: lat[m], lng: lng[m], text: String(g), color: gearColor(g) });
    }
    start = i;
  }
  return out;
}

function eventItems() {
  const lat = DATA.cols.lat, lng = DATA.cols.lng;
  if (!lat || !lng) return [];
  return EVENTS.filter((e) => !isNaN(lat[e.i]) && !isNaN(lng[e.i]))
    .map((e) => ({ lat: lat[e.i], lng: lng[e.i], color: css("--" + e.sev), title: fmtClock(DATA.t[e.i]) + " · " + e.text, i: e.i }));
}

function drawMap(fit) {
  if (!ENGINE || !DATA || liveMode) return;
  const segs = routeSegments();
  ENGINE.setRoute(segs);
  ENGINE.setLabels(ROUTE_MODE === "gear" ? gearLabelItems() : []);

  { k: "top", label: "Top down", short: "TOP", yaw: 0, pitch: -90, zoom: 19.9, ahead: 0, icon: "M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5" },

function setCam(mode, quiet) {

/** Is the car on the map and clear of the instrument cluster (the cluster covers a corner of the map)? */
function carInView(lat, lng) {
  if (!ENGINE.contains(lat, lng)) return false;
  const px = ENGINE.project ? ENGINE.project(lat, lng) : null;
  if (!px) return true;
  const m = $("map").getBoundingClientRect(), h = $("hud").getBoundingClientRect();
  const x = m.left + px[0], y = m.top + px[1], pad = 24;
  return !(x > h.left - pad && x < h.right + pad && y > h.top - pad && y < h.bottom + pad);

/** Height of the ground under the car (m above sea level) for Google's 3D map; NaN = unknown (about 30 m is assumed). */
let CAR_ALT = NaN, PHONE_FIX = null;
const LIVE_ALTS = [];
const median = (a) => { const b = a.filter((x) => !isNaN(x)).sort((x, y) => x - y); return b.length ? b[b.length >> 1] : NaN; };
function altNear(i) {
  const a = DATA && DATA.cols.alt;
  if (!a) return NaN;
  const out = [];
  for (let k = Math.max(RANGE[0], i - 15); k <= Math.min(RANGE[1], i + 15); k++) out.push(a[k]);
  return median(out);
}

/** Show the car; in Chase the camera rides behind it, in Overview the map pans to keep it in view. */
function placeCar(lat, lng, heading, braking, snap) {
  if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return;
  carShown = { lat, lng, heading, braking };
  if (!ENGINE) return;
  ENGINE.car({ lat, lng, heading, braking, chase: CAM === "chase" });
  if (CAM === "chase") followCar(lat, lng, heading, snap);
  else if (CAM === "overview" && playing && !carInView(lat, lng)) ENGINE.panTo(lat, lng);

function followCar(lat, lng, heading, snap) {
  const now = performance.now();
  const dt = camT ? Math.min(0.25, (now - camT) / 1000) : 0;
  camT = now;
  const ok = heading != null && !isNaN(heading);
  if (isNaN(camHead) || snap) camHead = ok ? heading : isNaN(camHead) ? 0 : camHead;
  else if (ok) camHead = (camHead + angleDiff(heading, camHead) * Math.min(1, dt * 2.5) + 360) % 360;   // turn with a slight lag
  // While playing, swing back behind the car a few seconds after the viewer lets go, like a game camera.
  if (playing && (orbitYaw || orbitPitch) && now - orbitTouched > 3500) {
    const k = Math.min(1, dt * 1.8);
    orbitYaw -= orbitYaw * k;
    orbitPitch -= orbitPitch * k;
    if (Math.abs(orbitYaw) < 0.3 && Math.abs(orbitPitch) < 0.3) { orbitYaw = 0; orbitPitch = 0; }
  }
  ENGINE.camera({ lat, lng, heading: (camHead + ANGLE.yaw + orbitYaw + 720) % 360, zoom: chaseZoom, pitch: ANGLE.pitch + orbitPitch, ahead: ANGLE.ahead });
}

/** Chase view: drag to look around the car (360°), scroll or pinch to zoom. The map itself stays put. */
function setupOrbit() {
  const el = $("map"), ptrs = new Map();
  let pinch0 = 0, zoom0 = 0;
  const redraw = () => { orbitTouched = performance.now(); if (carShown) followCar(carShown.lat, carShown.lng, carShown.heading, true); };
  el.addEventListener("pointerdown", (e) => {
    if (CAM !== "chase") return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch0 = Math.hypot(a.x - b.x, a.y - b.y);
      zoom0 = chaseZoom;
    }
    orbitTouched = performance.now();
  });
  el.addEventListener("pointermove", (e) => {
    const p = ptrs.get(e.pointerId);
    if (CAM !== "chase" || !p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      orbitYaw = ((orbitYaw - dx * 0.35 + 540) % 360) - 180;
      orbitPitch = Math.max(-40, Math.min(12, orbitPitch + dy * 0.25));
    } else if (ptrs.size === 2 && pinch0) {
      const [a, b] = [...ptrs.values()];
      chaseZoom = Math.max(17.5, Math.min(22, zoom0 + Math.log2(Math.hypot(a.x - b.x, a.y - b.y) / pinch0)));
    }
    redraw();
  });
  const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", (e) => {
    if (CAM !== "chase") return;
    e.preventDefault();
    chaseZoom = Math.max(17.5, Math.min(22, chaseZoom - e.deltaY * 0.002));
    redraw();
  }, { passive: false });
}

      chaseZoom = Math.max(17.5, Math.min(22, chaseZoom + d * 0.75));
      if (carShown) placeCar(carShown.lat, carShown.lng, carShown.heading, carShown.braking, true);
    } else if (ENGINE) ENGINE.zoomBy(d);
  };
  $("zoomIn").onclick = () => zoom(1);
  $("zoomOut").onclick = () => zoom(-1);
  $("camBtn").onclick = () => setCam(CAM === "chase" ? "overview" : "chase");
  $("dimBtn").onclick = () => setView(!VIEW3D, SAT);
  $("layerBtn").onclick = () => setView(VIEW3D, !SAT);
  // Camera angle menu: a glass grid of the six views.
  const menu = $("angleMenu"), angleBtn = $("angleBtn");
  ANGLES.forEach((a) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitemradio");
    b.dataset.k = a.k;
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="8" width="6" height="9" rx="2"/><path d="${a.icon}"/></svg>${a.label}`;
    b.onclick = () => { setAngle(a.k); openAngleMenu(false); };
    menu.appendChild(b);
  });
  const openAngleMenu = (open) => {
    menu.hidden = !open;
    angleBtn.setAttribute("aria-expanded", String(open));
    if (open) (menu.querySelector('[aria-checked="true"]') || menu.firstChild).focus();
  };
  angleBtn.onclick = () => openAngleMenu(menu.hidden);
  document.addEventListener("pointerdown", (e) => { if (!menu.hidden && !menu.contains(e.target) && !angleBtn.contains(e.target)) openAngleMenu(false); });
  menu.addEventListener("keydown", (e) => {
    const items = [...menu.children], k = items.indexOf(document.activeElement);
    if (e.key === "Escape") { openAngleMenu(false); angleBtn.focus(); }
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); items[(k + 1) % items.length].focus(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); items[(k - 1 + items.length) % items.length].focus(); }
  });
  syncAngleMenu();
  document.addEventListener("keydown", (e) => {
    if ((e.key === "v" || e.key === "V") && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) {
      setAngle(ANGLES[(ANGLES.indexOf(ANGLE) + 1) % ANGLES.length].k);
    }
  });
  syncViewButtons();
  setupOrbit();
}

// ---------------------------------------------------------------- game-style instrument cluster (speed · gear · RPM)
const RPM_MAX = 7000, RPM_AMBER = 4500, RPM_RED = 6000, SEGS = 28;
let segEls = [], segLit = -1, shiftTimer = 0;

/** Draw the rev dial once: 28 segments over a 270° sweep, 0-7 (x1000 rpm) ticks and a redline arc. */
function buildGauge() {
  const P = (r, deg) => { const a = (deg * Math.PI) / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
  const f = (pt) => pt[0].toFixed(2) + " " + pt[1].toFixed(2);
  const A0 = 135, SWEEP = 270, GAP = 1.6;
  let segs = "";
  for (let i = 0; i < SEGS; i++) {
    const a0 = A0 + (SWEEP * i) / SEGS + GAP / 2, a1 = A0 + (SWEEP * (i + 1)) / SEGS - GAP / 2;
    segs += `<path d="M${f(P(92, a0))} A92 92 0 0 1 ${f(P(92, a1))} L${f(P(78, a1))} A78 78 0 0 0 ${f(P(78, a0))} Z"/>`;
  }
  $("gaugeSegs").innerHTML = segs;
  segEls = Array.from($("gaugeSegs").children);
  let t = "";
  for (let k = 0; k <= 7; k++) {
    const pt = P(64, A0 + (SWEEP * k * 1000) / RPM_MAX);
    t += `<text class="g-tick${k * 1000 >= RPM_RED ? " red" : ""}" x="${pt[0].toFixed(2)}" y="${(pt[1] + 4).toFixed(2)}" text-anchor="middle">${k}</text>`;
  }
  t += `<path class="g-redline" d="M${f(P(97, A0 + (SWEEP * RPM_RED) / RPM_MAX))} A97 97 0 0 1 ${f(P(97, A0 + SWEEP))}"/>`;
  $("gaugeTicks").innerHTML = t;
}

/**
 * Where the accelerator pedal rests and where it's flat out, from a set of pedal readings (sensor D, %): the foot is
 * off most of the time, so a low percentile is the resting point (about 19 % on this car); flat out is about 80 %,
 * or more if seen. Null when the car doesn't report the pedal.
 */
function pedalRange(values) {
  const v = [];
  for (const x of values) if (x != null && !isNaN(x)) v.push(+x);
  if (!v.length) return null;
  v.sort((a, b) => a - b);
  return { rest: Math.min(v[Math.floor(v.length * 0.1)], 22), full: Math.max(80, v[v.length - 1]) };
}
/**
 * How far the accelerator is pressed, 0-1. From the pedal reading when the car gives one (range from pedalRange):
 * the throttle valve reading isn't the pedal, and on this turbo car it sits at 20-30 % with the foot off. Cars that
 * don't report the pedal fall back to the throttle reading (about 15 % when the pedal is up).
 */
function accelFrac(pedal, range, throttle) {
  if (range) return pedal == null || isNaN(pedal) ? 0 : Math.max(0, Math.min(1, (pedal - range.rest - 2) / (range.full - range.rest - 2)));   // 2 points of jitter at rest
  return throttle == null || isNaN(throttle) ? 0 : Math.max(0, Math.min(1, (throttle - 15) / 70));
}

/**
 * Speed, gear, rev dial, shift lights and pedal bars. accel = how far the accelerator is pressed, 0-1 (accelFrac),
 * decel = how fast the car is slowing (km/h per second; braking estimate).
 */
function updateHud(speedRaw, rpm, gear, prevGear, accel, decel) {
  const sp = disp("SPEED", speedRaw);
  $("hudSpeed").textContent = sp == null ? "--" : Math.round(sp);
  $("hudUnit").textContent = unit("SPEED").toUpperCase();
  $("hudGearVal").textContent = gear || "–";
  const ok = rpm != null && !isNaN(rpm);
  $("hudRpm").textContent = ok ? Math.round(rpm).toLocaleString("en-GB") + " rpm" : "-- rpm";
  const lit = ok ? Math.round(Math.max(0, Math.min(1, rpm / RPM_MAX)) * SEGS) : 0;
  if (lit !== segLit) {
    segLit = lit;
    segEls.forEach((el, i) => {
      const top = ((i + 1) * RPM_MAX) / SEGS;
      el.setAttribute("class", i < lit ? (top > RPM_RED ? "on red" : top > RPM_AMBER ? "on amber" : "on") : "");
    });
  }
  // Shift lights build up from 3,000 rpm in gears 1-4 and blink from 5,000 ("change up now").
  const g = +gear;
  const n = ok && g >= 1 && g <= 4 ? Math.max(0, Math.min(5, Math.floor((rpm - 3000) / 400) + 1)) : 0;
  const leds = $("shiftLights");
  Array.from(leds.children).forEach((el, i) => el.classList.toggle("on", i < n));
  leds.classList.toggle("flash", n > 0 && rpm >= 5000);
  // Pedal bars: the accelerator, and the brake from how hard the car slows.
  const thr = accel == null || isNaN(accel) ? 0 : Math.max(0, Math.min(1, accel));
  const brk = decel == null || isNaN(decel) ? 0 : Math.max(0, Math.min(1, decel / 15));
  $("thrBar").style.height = Math.round(thr * 100) + "%";
  $("brkBar").style.height = Math.round(brk * 100) + "%";
  const a = +prevGear;
  if (a >= 1 && g >= 1 && a !== g) flashShift(g > a ? "↑" : "↓");
}
function flashShift(arrow) {
  const el = $("hudGear");
  $("hudShift").textContent = arrow;
  el.classList.add("shift");
  clearTimeout(shiftTimer);
  shiftTimer = setTimeout(() => el.classList.remove("shift"), reducedMotion ? 1600 : 1100);
}


// ================================================================ charts
const CHART_DEFS = [
  { id: "speed", title: "Speed", keys: ["SPEED"], on: true },
  { id: "rpm", title: "Engine RPM", keys: ["ENGINE_RPM"], on: true },
  { id: "temp", title: "Temperatures", keys: ["COOLANT_TEMP", "INTAKE_TEMP"], on: true },
  { id: "trim", title: "Fuel trims", keys: ["SHORT_FUEL_TRIM", "LONG_FUEL_TRIM"], on: true, band: [-10, 10] },
  { id: "load", title: "Load & throttle", keys: ["ENGINE_LOAD", "THROTTLE"], on: false },

  { id: "maf", title: "Air flow", keys: ["MAF"], on: false },

];
// Charts scroll like a live readout: they end at the playback moment and show the last few minutes.

let CHART_WIN = store.get("chartWin", "300");
if (!WINDOWS.some((w) => w[0] === CHART_WIN)) CHART_WIN = "300";

function chartChips() {

function windowSeg() {
